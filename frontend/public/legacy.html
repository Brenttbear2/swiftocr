<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftOCR · 發票辨識</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F5F4F0;
      --dark:    #1A1E2D;
      --seal:    #B23A2E;
      --seal-lt: #FBEBE6;
      --card:    #FFFFFF;
      --border:  #E5E3DC;
      --muted:   #6B6960;
      --openai:  #10A37F;
      --google:  #4285F4;
      --red:     #DC2626;
      --mono:    'SF Mono', 'Consolas', 'Courier New', monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      .stamp-mark, .spinner { animation: none !important; }
    }

    button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--seal);
      outline-offset: 2px;
    }

    body {
      font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      font-size: 16.5px;
      line-height: 1.45;
    }

    /* ── HEADER ── */
    header {
      background: var(--dark);
      height: 46px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo-mark {
      width: 26px; height: 26px;
      background: var(--seal);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .logo-text { color: #fff; font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
    .logo-divider { width: 1px; height: 16px; background: #ffffff20; margin: 0 4px; }
    .logo-sub { color: #ffffff45; font-size: 13.5px; font-family: var(--mono); letter-spacing: 0.05em; }

    /* ── LAYOUT ── */
    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 46px);
    }
    @media (max-width: 800px) {
      .app-layout { grid-template-columns: 1fr; height: auto; }
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      border-right: 1px solid var(--border);
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .section-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* ── MODEL TABS ── */
    .model-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .model-tab {
      padding: 5px 4px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: #FAFAF8;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 5px;
      line-height: 1;
    }
    .tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .model-tab:hover { border-color: var(--muted); color: var(--dark); }
    .model-tab.active[data-cat="openai"] { background: #E6F7F3; color: var(--openai); border-color: var(--openai); }
    .model-tab.active[data-cat="openai"] .tab-dot { background: var(--openai); }
    .model-tab.active[data-cat="google"] { background: #EEF4FF; color: var(--google); border-color: var(--google); }
    .model-tab.active[data-cat="google"] .tab-dot { background: var(--google); }

    .model-select-wrap { position: relative; }
    .model-select {
      width: 100%;
      padding: 7px 28px 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      color: var(--dark);
      background: #FAFAF8;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.12s;
    }
    .model-select:focus { outline: none; border-color: var(--seal); }
    .select-arrow {
      position: absolute; right: 9px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none; color: var(--muted); font-size: 12.5px;
    }
    .model-note {
      margin-top: 5px;
      font-size: 13px;
      color: var(--muted);
      min-height: 14px;
      padding-left: 1px;
    }

    /* ── UPLOAD ZONE ── */
    #drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 13px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      background: #FAFAF8;
      user-select: none;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--seal);
      background: var(--seal-lt);
    }
    .upload-icon { margin-bottom: 5px; opacity: 0.5; }
    .upload-icon svg { display: block; margin: 0 auto; width: 20px; height: 20px; }
    .upload-text { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: var(--dark); }
    .upload-sub  { font-size: 13px; color: var(--muted); }
    #file-input  { display: none; }

    /* ── QUEUE ── */
    .queue-header {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .queue-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .queue-count {
      font-size: 12.5px;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--muted);
    }

    .queue-list { flex: 1; overflow-y: auto; }
    .queue-list::-webkit-scrollbar { width: 3px; }
    .queue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .queue-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      opacity: 0.7;
    }

    .queue-item {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      transition: background 0.1s, border-left-color 0.1s;
    }
    .queue-item:hover { background: #FAFAF8; }
    .queue-item.selected { background: var(--seal-lt); border-left-color: var(--seal); }

    .queue-thumb {
      width: 32px; height: 32px;
      border-radius: 5px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      overflow: hidden;
    }
    .queue-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .queue-thumb svg { width: 15px; height: 15px; }

    .queue-info { flex: 1; min-width: 0; }
    .queue-filename {
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .status-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12.5px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }
    .status-pending    { background: #F3F4F6; color: #9CA3AF; }
    .status-processing { background: #EEF4FF; color: var(--google); }
    .status-done       { background: #E6F7F3; color: var(--openai); }
    .status-error      { background: #FEF2F2; color: var(--red); }

    .queue-remove {
      width: 22px; height: 22px;
      border: none; background: none;
      color: var(--muted); font-size: 14.5px;
      cursor: pointer; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    .queue-item:hover .queue-remove { opacity: 1; }
    .queue-remove:hover { background: #FEF2F2; color: var(--red); }

    /* ── ACTIONS ── */
    .queue-actions {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }
    .btn-primary {
      flex: 1; padding: 9px;
      background: var(--dark); color: #fff;
      border: none; border-radius: 6px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.12s, opacity 0.12s;
    }
    .btn-primary:hover:not(:disabled) { background: #2D3347; }
    .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }

    .btn-ghost {
      padding: 9px 12px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 14px; font-weight: 600; color: var(--muted);
      cursor: pointer; transition: border-color 0.1s, color 0.1s;
    }
    .btn-ghost:hover { border-color: var(--red); color: var(--red); }

    /* ── SPINNER ── */
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid #ffffff30; border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RIGHT PANEL ── */
    .right-panel { display: flex; flex-direction: column; overflow: hidden; }

    .right-header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .right-title { font-size: 15.5px; font-weight: 700; }

    .result-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .result-body::-webkit-scrollbar { width: 4px; }
    .result-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── EMPTY STATE ── */
    .empty-state {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; color: var(--muted); padding: 40px;
    }
    .empty-icon { opacity: 0.22; margin-bottom: 12px; }
    .empty-title { font-size: 15.5px; font-weight: 600; opacity: 0.55; margin-bottom: 4px; }
    .empty-sub { font-size: 14px; opacity: 0.4; }

    /* ── BATCH SUMMARY ── */
    .batch-summary {
      display: none;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .summary-title {
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin-bottom: 7px;
    }
    .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-box {
      text-align: center; padding: 7px 4px;
      border-radius: 6px; background: var(--bg);
      border: 1px solid var(--border);
    }
    .stat-num { font-size: 22.5px; font-weight: 700; font-family: var(--mono); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .stat-box.s-total   .stat-num { color: var(--dark); }
    .stat-box.s-pending .stat-num { color: var(--muted); }
    .stat-box.s-done    .stat-num { color: var(--openai); }
    .stat-box.s-error   .stat-num { color: var(--red); }

    /* ── RESULT DISPLAY ── */
    .result-display { display: none; }

    .result-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px;
      margin-bottom: 10px;
    }
    .type-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 14px; font-weight: 700; margin-bottom: 4px;
    }
    .type-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .badge-triple    { background: #EEF4FF; color: var(--google); }
    .badge-cashier   { background: #F3EEFF; color: #6D28D9; }
    .badge-dual      { background: #E6F7F3; color: var(--openai); }
    .badge-unknown   { background: #F3F4F6; color: var(--muted); }
    .model-tag { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }

    /* ── STAMP（辨識完成的簽名元素，呼應統一發票核章）── */
    .stamp-mark {
      width: 58px; height: 58px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      border: 2.5px solid var(--seal);
      border-radius: 50%;
      color: var(--seal);
      font-size: 12px; font-weight: 800; letter-spacing: 0.03em;
      transform: rotate(-9deg);
      opacity: 0.85;
      position: relative;
      mix-blend-mode: multiply;
      animation: stamp-hit 0.5s cubic-bezier(.36, 1.75, .4, 1) both;
    }
    .stamp-mark::before {
      content: ''; position: absolute; inset: 6px;
      border: 1px solid var(--seal); border-radius: 50%; opacity: 0.6;
    }
    @keyframes stamp-hit {
      0%   { transform: scale(2.4) rotate(-24deg); opacity: 0; }
      55%  { transform: scale(0.92) rotate(-7deg);  opacity: 0.9; }
      100% { transform: scale(1) rotate(-9deg);     opacity: 0.85; }
    }

    /* ── AMOUNT CARD ── */
    .amount-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .amount-card-label {
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted);
      padding: 9px 14px 7px;
      border-bottom: 1px solid var(--border);
    }
    .amount-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
    }
    .amount-row.total-row {
      background: var(--seal-lt);
      border-bottom: none;
      padding: 8px 14px;
      border-top: 2px solid var(--seal);
    }
    .amount-lbl { font-size: 14px; color: var(--muted); }
    .amount-lbl.total-lbl { font-size: 14.5px; font-weight: 700; color: var(--dark); }
    .amount-val {
      font-size: 17px; font-weight: 700;
      color: var(--dark); font-family: var(--mono);
    }
    .amount-val.total { font-size: 27px; color: var(--seal); }
    .amount-val.is-null { color: #C8C6BF; font-style: italic; font-weight: 400; font-size: 14.5px; font-family: inherit; }

    /* ── FIELDS GRID ── */
    .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .field-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 7px; padding: 7px 10px;
    }
    .field-card.wide { grid-column: 1 / -1; }
    .field-lbl {
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); margin-bottom: 4px;
    }
    .field-val {
      font-size: 16px; font-weight: 700;
      color: var(--dark); font-family: var(--mono); letter-spacing: 0.03em;
    }
    .field-val.null-val {
      color: #C8C6BF; font-style: italic;
      font-weight: 400; font-size: 14.5px; font-family: inherit; letter-spacing: 0;
    }

    /* ── 原圖對照（結果雙欄）── */
    .result-grid {
      display: grid;
      grid-template-columns: minmax(260px, 5fr) 6fr;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .result-grid { grid-template-columns: 1fr; }
    }
    .doc-panel {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: sticky;
      top: 0;
    }
    .doc-label {
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted);
      padding: 9px 14px 7px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .doc-frame {
      background: #EBEAE5;
      min-height: 200px;
      max-height: calc(100vh - 220px);
      display: flex; align-items: flex-start; justify-content: center;
      overflow: auto;
    }
    .doc-frame img {
      max-width: 100%;
      display: block;
      cursor: zoom-in;
    }
    .doc-frame img.zoomed { max-width: none; cursor: zoom-out; }
    .doc-frame embed {
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 420px;
      border: none;
    }
    .doc-frame .doc-none {
      padding: 60px 20px;
      font-size: 13px; color: var(--muted); opacity: 0.6;
    }

    /* ── 欄位可編輯修正 ── */
    .editable { cursor: pointer; border-radius: 4px; transition: background 0.1s, box-shadow 0.1s; }
    .editable:hover { background: var(--seal-lt); box-shadow: 0 0 0 4px var(--seal-lt); }
    .field-input {
      width: 100%;
      font-family: var(--mono);
      font-size: 15px; font-weight: 700;
      color: var(--dark);
      border: 1.5px solid var(--seal);
      border-radius: 5px;
      padding: 2px 6px;
      background: #fff;
      outline: none;
    }
    .amount-input {
      font-family: var(--mono);
      font-size: 15px; font-weight: 700;
      text-align: right;
      width: 130px;
      border: 1.5px solid var(--seal);
      border-radius: 5px;
      padding: 2px 6px;
      background: #fff;
      outline: none;
    }
    .edited-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--seal);
      margin-left: 6px;
      vertical-align: middle;
    }
    .edit-hint {
      font-size: 11.5px; color: var(--muted); opacity: 0.75;
      margin-bottom: 8px;
    }

    /* ── 匯出按鈕 ── */
    .header-actions { display: flex; gap: 7px; align-items: center; }
    .export-btn {
      padding: 6px 14px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 12.5px; font-weight: 600;
      color: var(--dark); cursor: pointer; transition: all 0.1s;
      display: none;
    }
    .export-btn:hover { border-color: var(--seal); color: var(--seal); }

    /* ── JSON SECTION ── */
    .json-section { margin-top: 2px; }
    .json-toggle {
      font-size: 13px; color: var(--muted);
      cursor: pointer; background: none; border: none; padding: 0;
      margin-bottom: 7px; display: flex; align-items: center; gap: 5px;
      transition: color 0.1s;
    }
    .json-toggle:hover { color: var(--dark); }
    pre#raw-json {
      display: none;
      background: var(--dark); color: #88CC88;
      padding: 14px; border-radius: 7px;
      font-family: var(--mono); font-size: 13px;
      line-height: 1.6; overflow-x: auto; white-space: pre;
    }

    /* ── ERROR BOX ── */
    .error-box {
      background: #FEF2F2; border: 1.5px solid #FECACA;
      border-left: 3.5px solid var(--red);
      border-radius: 7px; padding: 12px 14px;
      font-size: 14px; color: var(--red);
      display: none;
    }

    /* ── COPY BTN ── */
    .copy-btn {
      padding: 6px 14px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 13.5px; font-weight: 600;
      color: var(--dark); cursor: pointer; transition: all 0.1s;
      display: none;
    }
    .copy-btn:hover { background: #EEEDEA; }
    .copy-btn.copied { background: #E6F7F3; color: var(--openai); border-color: var(--openai); }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 13h6l-1 9 9-13h-6l1-9z"/></svg>
  </div>
  <span class="logo-text">SwiftOCR</span>
  <div class="logo-divider"></div>
  <span class="logo-sub">台灣發票辨識 · LLM Vision</span>
</header>

<div class="app-layout">

  <!-- ── LEFT: 上傳 + 佇列 ── -->
  <div class="left-panel">

    <!-- 模型選擇 -->
    <div class="panel-section">
      <div class="section-label">AI 辨識模型</div>
      <div class="model-tabs">
        <button class="model-tab active" data-cat="openai">
          <span class="tab-dot"></span>OpenAI
        </button>
        <button class="model-tab" data-cat="google">
          <span class="tab-dot"></span>Google
        </button>
      </div>
      <div class="model-select-wrap">
        <select class="model-select" id="model-select">
          <option value="">載入中…</option>
        </select>
        <span class="select-arrow">▾</span>
      </div>
      <div class="model-note" id="model-note"></div>
    </div>

    <!-- 上傳區 -->
    <div class="panel-section">
      <div class="section-label">上傳發票</div>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h9l3 3v15l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3z"/>
            <path d="M9 8h6M9 12h6M9 16h3"/>
          </svg>
        </div>
        <div class="upload-text">拖曳或點擊上傳</div>
        <div class="upload-sub">JPG · PNG · PDF · 可多選批次上傳</div>
      </div>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.pdf" multiple />
    </div>

    <!-- 佇列標題 -->
    <div class="queue-header">
      <span class="queue-title">辨識佇列</span>
      <span class="queue-count" id="queue-count">0 個檔案</span>
    </div>

    <!-- 佇列清單 -->
    <div class="queue-list" id="queue-list">
      <div class="queue-empty" id="queue-empty">尚未加入任何發票</div>
    </div>

    <!-- 操作按鈕 -->
    <div class="queue-actions">
      <button class="btn-primary" id="analyze-all-btn" disabled onclick="analyzeAll()">
        開始辨識全部
      </button>
      <button class="btn-ghost" onclick="clearQueue()" title="清除所有項目">清除</button>
    </div>

  </div>

  <!-- ── RIGHT: 結果 ── -->
  <div class="right-panel">

    <div class="right-header">
      <span class="right-title">辨識結果</span>
      <div class="header-actions">
        <button class="export-btn" id="export-csv-btn" onclick="exportCSV()">匯出 CSV</button>
        <button class="export-btn" id="export-json-btn" onclick="exportJSON()">匯出 JSON</button>
        <button class="copy-btn" id="copy-btn" onclick="copyJson()">複製 JSON</button>
      </div>
    </div>

    <div class="result-body" id="result-body">

      <!-- 批次統計 -->
      <div class="batch-summary" id="batch-summary">
        <div class="summary-title">批次統計</div>
        <div class="summary-stats">
          <div class="stat-box s-total">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-label">總計</div>
          </div>
          <div class="stat-box s-pending">
            <div class="stat-num" id="stat-pending">0</div>
            <div class="stat-label">待辨識</div>
          </div>
          <div class="stat-box s-done">
            <div class="stat-num" id="stat-done">0</div>
            <div class="stat-label">完成</div>
          </div>
          <div class="stat-box s-error">
            <div class="stat-num" id="stat-error">0</div>
            <div class="stat-label">失敗</div>
          </div>
        </div>
      </div>

      <!-- 空狀態 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h9l3 3v15l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3z"/>
            <path d="M9 8h6M9 12h6M9 16h3"/>
          </svg>
        </div>
        <div class="empty-title">尚無辨識結果</div>
        <div class="empty-sub">上傳發票後點擊「開始辨識全部」</div>
      </div>

      <!-- 選取項目的結果 -->
      <div class="result-display" id="result-display">
        <div class="result-top">
          <div>
            <div class="type-badge" id="r-type-badge"></div>
            <div class="model-tag" id="r-model-tag"></div>
          </div>
          <div class="stamp-mark" id="stamp-mark">辨識完成</div>
        </div>

        <div class="result-grid">
          <!-- 左：原始發票對照 -->
          <div class="doc-panel">
            <div class="doc-label">原始發票</div>
            <div class="doc-frame" id="doc-frame">
              <div class="doc-none">無法預覽此檔案</div>
            </div>
          </div>

          <!-- 右：結構化辨識結果 -->
          <div class="doc-data">
            <div class="edit-hint">辨識有誤？點擊任一欄位值即可直接修正，匯出與複製會使用修正後的值。</div>

            <div class="amount-card">
              <div class="amount-card-label">金額明細</div>
              <div class="amount-row">
                <span class="amount-lbl">銷售額（未稅）</span>
                <span id="r-sales" class="amount-val editable" onclick="editAmount(this, 'sales')">—</span>
              </div>
              <div class="amount-row">
                <span class="amount-lbl">稅額（5%）</span>
                <span id="r-tax" class="amount-val editable" onclick="editAmount(this, 'tax')">—</span>
              </div>
              <div class="amount-row total-row">
                <span class="amount-lbl total-lbl">含稅總計</span>
                <span id="r-total" class="amount-val total editable" onclick="editAmount(this, 'total')">—</span>
              </div>
            </div>

            <div class="fields-grid">
              <div class="field-card wide">
                <div class="field-lbl">發票號碼</div>
                <div class="field-val editable" id="r-invoice-number" onclick="editField(this, 'invoice_number')">—</div>
              </div>
              <div class="field-card">
                <div class="field-lbl">開立日期</div>
                <div class="field-val editable" id="r-date" onclick="editField(this, 'date')">—</div>
              </div>
              <div class="field-card">
                <div class="field-lbl">稅額編碼（format）</div>
                <div class="field-val editable" id="r-format" onclick="editField(this, 'format')">—</div>
              </div>
              <div class="field-card">
                <div class="field-lbl">買受人統編</div>
                <div class="field-val editable" id="r-buyer" onclick="editField(this, 'buyer_taxno')">—</div>
              </div>
              <div class="field-card">
                <div class="field-lbl">賣方統編</div>
                <div class="field-val editable" id="r-seller" onclick="editField(this, 'seller_taxno')">—</div>
              </div>
            </div>

            <div class="json-section">
              <button class="json-toggle" onclick="toggleJson()">
                <span id="json-arrow">▶</span> 原始 JSON
              </button>
              <pre id="raw-json"></pre>
            </div>
          </div>
        </div>
      </div>

      <!-- 錯誤顯示 -->
      <div class="error-box" id="error-display">
        <span id="error-text"></span>
      </div>

    </div>
  </div>
</div>

<script>
  // ── 狀態 ──
  let fileQueue = [];     // [{id, file, status, result, previewUrl, isPdf, error, elapsed, editedKeys}]
  let selectedId = null;
  let modelsData = [];    // [{id, label, category, note}]
  let currentCategory = 'openai';
  let currentItem = null; // 目前顯示中的佇列項目（編輯/複製都以它為準）
  let jsonVisible = false;
  let isProcessing = false;

  // ── 載入模型清單 ──
  async function loadModels() {
    try {
      const res = await fetch('/api/models');
      modelsData = await res.json();
    } catch {
      modelsData = [
        { id: 'openai/gpt-4o', label: 'GPT-4o', category: 'openai', note: 'OpenAI 旗艦視覺模型' }
      ];
    }
    renderModelSelect('openai');
  }

  function renderModelSelect(cat) {
    currentCategory = cat;
    const filtered = modelsData.filter(m => m.category === cat);
    const sel = document.getElementById('model-select');
    sel.innerHTML = '';
    if (filtered.length === 0) {
      sel.innerHTML = '<option value="">此類別暫無模型</option>';
    } else {
      filtered.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label;
        if (i === 0) opt.selected = true;
        sel.appendChild(opt);
      });
    }
    updateModelNote();
  }

  function updateModelNote() {
    const val = document.getElementById('model-select').value;
    const m = modelsData.find(x => x.id === val);
    document.getElementById('model-note').textContent = m ? m.note : '';
  }

  document.querySelectorAll('.model-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderModelSelect(tab.dataset.cat);
    });
  });
  document.getElementById('model-select').addEventListener('change', updateModelNote);

  loadModels();

  // ── 上傳 ──
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', e => {
    addFiles([...e.target.files]);
    fileInput.value = '';
  });

  function addFiles(files) {
    const allowed = ['image/jpeg', 'image/png', 'application/pdf'];
    let rejected = 0;
    files.forEach(file => {
      if (!allowed.includes(file.type)) { rejected++; return; }
      const id = crypto.randomUUID();
      fileQueue.push({
        id, file, status: 'pending', result: null,
        previewUrl: URL.createObjectURL(file),   // PDF 也建立預覽（結果頁用 embed 顯示）
        isPdf: file.type === 'application/pdf',
        error: null, elapsed: null, editedKeys: {}
      });
    });
    if (rejected > 0) alert(`${rejected} 個檔案格式不支援（僅接受 JPG、PNG、PDF），已略過`);
    renderQueue();
    updateAnalyzeBtn();
    updateBatchSummary();
  }

  // ── 佇列渲染 ──
  function renderQueue() {
    const list = document.getElementById('queue-list');
    document.getElementById('queue-count').textContent = `${fileQueue.length} 個檔案`;

    if (fileQueue.length === 0) {
      list.innerHTML = '<div class="queue-empty">尚未加入任何發票</div>';
      return;
    }

    list.innerHTML = '';
    fileQueue.forEach(item => {
      const el = document.createElement('div');
      el.className = 'queue-item' + (item.id === selectedId ? ' selected' : '');

      const thumb = (!item.isPdf && item.previewUrl)
        ? `<div class="queue-thumb"><img src="${item.previewUrl}" alt="" /></div>`
        : `<div class="queue-thumb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div>`;

      const statusMap = {
        pending:    { cls: 'status-pending',    txt: '待辨識' },
        processing: { cls: 'status-processing', txt: '辨識中…' },
        done:       { cls: 'status-done',       txt: item.elapsed ? `完成 · ${item.elapsed}s` : '完成' },
        error:      { cls: 'status-error',      txt: '失敗' },
      };
      const s = statusMap[item.status];

      el.innerHTML = `
        ${thumb}
        <div class="queue-info">
          <div class="queue-filename">${item.file.name}</div>
          <span class="status-chip ${s.cls}">${s.txt}</span>
        </div>
        <button class="queue-remove" title="移除">✕</button>
      `;
      el.querySelector('.queue-remove').addEventListener('click', e => {
        e.stopPropagation(); removeItem(item.id);
      });
      el.addEventListener('click', () => selectItem(item.id));
      list.appendChild(el);
    });
  }

  function selectItem(id) {
    selectedId = id;
    renderQueue();
    const item = fileQueue.find(x => x.id === id);
    if (!item) return;
    if (item.status === 'done') showResult(item, { replayStamp: false });
    else if (item.status === 'error') showError(item.error);
    else showEmpty();
  }

  function removeItem(id) {
    const item = fileQueue.find(x => x.id === id);
    if (item && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
    fileQueue = fileQueue.filter(x => x.id !== id);
    if (selectedId === id) { selectedId = null; showEmpty(); }
    renderQueue(); updateAnalyzeBtn(); updateBatchSummary();
  }

  function clearQueue() {
    fileQueue.forEach(x => { if (x.previewUrl) URL.revokeObjectURL(x.previewUrl); });
    fileQueue = []; selectedId = null; currentItem = null;
    showEmpty(); renderQueue(); updateAnalyzeBtn(); updateBatchSummary();
    document.getElementById('copy-btn').style.display = 'none';
  }

  // ── 辨識 ──
  function updateAnalyzeBtn() {
    const btn = document.getElementById('analyze-all-btn');
    const hasPending = fileQueue.some(x => x.status === 'pending');
    btn.disabled = !hasPending || isProcessing;
  }

  async function analyzeAll() {
    const pending = fileQueue.filter(x => x.status === 'pending');
    if (!pending.length) return;
    isProcessing = true;
    updateAnalyzeBtn();

    const btn = document.getElementById('analyze-all-btn');
    let elapsed = 0;
    const timer = setInterval(() => {
      elapsed++;
      btn.innerHTML = `<div class="spinner"></div> 辨識中… ${elapsed}s`;
    }, 1000);
    btn.innerHTML = '<div class="spinner"></div> 辨識中… 0s';

    for (const item of pending) {
      await analyzeItem(item.id);
    }

    clearInterval(timer);
    isProcessing = false;
    btn.innerHTML = `完成（共 ${elapsed}s）`;
    setTimeout(() => {
      btn.innerHTML = '開始辨識全部';
      updateAnalyzeBtn();
    }, 2500);
  }

  async function analyzeItem(id) {
    const item = fileQueue.find(x => x.id === id);
    if (!item) return;
    item.status = 'processing';
    renderQueue();
    if (selectedId === id) showEmpty();

    const t0 = performance.now();
    try {
      const formData = new FormData();
      formData.append('file', item.file);
      const model = document.getElementById('model-select').value;
      if (model) formData.append('model', model);

      const res = await fetch('/api/ocr', { method: 'POST', body: formData });
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || '辨識失敗，請重試');
      item.status = 'done';
      // v2 API 回應為 {data, warnings, meta}；階段 2 改寫前，舊畫面沿用扁平格式顯示
      item.result = { ...body.data, _model: body.meta.model };
      item.editedKeys = {};   // 重新辨識後清除先前的人工修正標記
    } catch (err) {
      item.status = 'error';
      item.error = err.message;
    }
    item.elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    // 自動選取並顯示最新完成的項目，不需要使用者手動點擊
    selectedId = id;
    renderQueue(); updateBatchSummary();
    if (item.status === 'done') showResult(item, { replayStamp: true });
    else showError(item.error);
  }

  // ── 結果顯示 ──
  function showEmpty() {
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('result-display').style.display = 'none';
    document.getElementById('error-display').style.display = 'none';
    document.getElementById('copy-btn').style.display = 'none';
    currentItem = null; jsonVisible = false;
    document.getElementById('raw-json').style.display = 'none';
    document.getElementById('json-arrow').textContent = '▶';
  }

  function showError(msg) {
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('result-display').style.display = 'none';
    document.getElementById('error-display').style.display = 'block';
    document.getElementById('error-text').textContent = msg;
    document.getElementById('copy-btn').style.display = 'none';
  }

  function showResult(item, opts = {}) {
    currentItem = item;
    const data = item.result;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('error-display').style.display = 'none';
    document.getElementById('result-display').style.display = 'block';
    document.getElementById('copy-btn').style.display = 'inline-block';

    // 模型 + 耗時
    const elapsedTxt = item.elapsed ? ` · 耗時 ${item.elapsed}s` : '';
    document.getElementById('r-model-tag').textContent = (data._model || '') + elapsedTxt;

    // 原圖對照
    renderDocFrame(item);

    const typeMap = {
      'tw_triple':         { label: '三聯式統一發票', cls: 'badge-triple'  },
      'tw_triple_cashier': { label: '收銀機三聯發票', cls: 'badge-cashier' },
      'tw_dual_cashier':   { label: '二聯式長條發票', cls: 'badge-dual'   },
    };
    const t = typeMap[data.type] || { label: data.type || '未知類型', cls: 'badge-unknown' };
    const badge = document.getElementById('r-type-badge');
    badge.className = `type-badge ${t.cls}`;
    badge.textContent = t.label;
    if (opts.replayStamp) triggerStamp();

    setAmount('r-sales', data.sales, item.editedKeys['sales']);
    setAmount('r-tax',   data.tax,   item.editedKeys['tax']);
    setAmount('r-total', data.total, item.editedKeys['total']);

    setField('r-invoice-number', data.invoice_number, item.editedKeys['invoice_number']);
    setField('r-date',   data.date,   item.editedKeys['date']);
    setField('r-format', data.format != null ? String(data.format) : null, item.editedKeys['format']);
    setField('r-buyer',  data.buyer_taxno,  item.editedKeys['buyer_taxno']);
    setField('r-seller', data.seller_taxno, item.editedKeys['seller_taxno']);

    refreshRawJson();
  }

  // 原圖對照面板：圖片直接顯示（點擊可放大），PDF 用瀏覽器內建檢視器
  function renderDocFrame(item) {
    const frame = document.getElementById('doc-frame');
    if (!item.previewUrl) {
      frame.innerHTML = '<div class="doc-none">無法預覽此檔案</div>';
      return;
    }
    if (item.isPdf) {
      frame.innerHTML = `<embed src="${item.previewUrl}" type="application/pdf" />`;
    } else {
      frame.innerHTML = `<img src="${item.previewUrl}" alt="發票原圖" onclick="this.classList.toggle('zoomed')" />`;
    }
  }

  function refreshRawJson() {
    if (!currentItem) return;
    const clean = { ...currentItem.result };
    delete clean._model;
    document.getElementById('raw-json').textContent = JSON.stringify(clean, null, 2);
  }

  // 重播蓋章動效（每次顯示新結果時重新觸發一次）
  function triggerStamp() {
    const el = document.getElementById('stamp-mark');
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  function setField(id, value, edited) {
    const el = document.getElementById(id);
    if (value == null) {
      el.textContent = 'null';
      el.className = 'field-val null-val editable';
    } else {
      el.textContent = value;
      el.className = 'field-val editable';
    }
    if (edited) el.appendChild(makeEditedDot());
  }

  // 金額專用：不覆蓋 amount-val class，只改文字與 null 樣式
  function setAmount(id, value, edited) {
    const el = document.getElementById(id);
    if (value == null) {
      el.textContent = '—';
      el.classList.add('is-null');
    } else {
      el.textContent = `NT$ ${value.toLocaleString()}`;
      el.classList.remove('is-null');
    }
    el.querySelectorAll('.edited-dot').forEach(d => d.remove());
    if (edited) el.appendChild(makeEditedDot());
  }

  function makeEditedDot() {
    const dot = document.createElement('span');
    dot.className = 'edited-dot';
    dot.title = '已人工修正';
    return dot;
  }

  // ── 欄位可編輯修正 ──
  // 文字欄位：點擊後就地換成輸入框，Enter 或失焦提交，Esc 取消；空值視為 null
  function editField(el, key) {
    if (!currentItem || el.querySelector('input')) return;
    const data = currentItem.result;
    const raw = data[key];
    const input = document.createElement('input');
    input.className = 'field-input';
    input.value = raw == null ? '' : String(raw);
    el.textContent = '';
    el.appendChild(input);
    input.focus(); input.select();

    const commit = () => {
      const v = input.value.trim();
      let newVal = v === '' ? null : v;
      if (key === 'format' && newVal != null) {
        const n = parseInt(newVal, 10);
        newVal = isNaN(n) ? null : n;
      }
      if (newVal !== raw) {
        data[key] = newVal;
        currentItem.editedKeys[key] = true;
      }
      showResult(currentItem, { replayStamp: false });
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = raw == null ? '' : String(raw); input.blur(); }
    });
    input.addEventListener('blur', commit);
  }

  // 金額欄位：只接受整數，空值視為 null
  function editAmount(el, key) {
    if (!currentItem || el.querySelector('input')) return;
    const data = currentItem.result;
    const raw = data[key];
    const input = document.createElement('input');
    input.className = 'amount-input';
    input.type = 'text';
    input.inputMode = 'numeric';
    input.value = raw == null ? '' : String(raw);
    el.textContent = '';
    el.classList.remove('is-null');
    el.appendChild(input);
    input.focus(); input.select();

    const commit = () => {
      const v = input.value.replace(/[,\s]/g, '').trim();
      let newVal = null;
      if (v !== '') {
        const n = Math.round(Number(v));
        newVal = isNaN(n) ? raw : n;   // 輸入非數字則還原原值
      }
      if (newVal !== raw) {
        data[key] = newVal;
        currentItem.editedKeys[key] = true;
      }
      showResult(currentItem, { replayStamp: false });
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = raw == null ? '' : String(raw); input.blur(); }
    });
    input.addEventListener('blur', commit);
  }

  function toggleJson() {
    jsonVisible = !jsonVisible;
    document.getElementById('raw-json').style.display = jsonVisible ? 'block' : 'none';
    document.getElementById('json-arrow').textContent = jsonVisible ? '▼' : '▶';
  }

  function copyJson() {
    if (!currentItem || !currentItem.result) return;
    const clean = { ...currentItem.result };
    delete clean._model;
    navigator.clipboard.writeText(JSON.stringify(clean, null, 2)).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '已複製';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '複製 JSON'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // ── 批次結果匯出 ──
  const EXPORT_COLUMNS = [
    ['filename',       '檔名'],
    ['type',           'type'],
    ['format',         'format'],
    ['invoice_number', 'invoice_number'],
    ['date',           'date'],
    ['buyer_taxno',    'buyer_taxno'],
    ['seller_taxno',   'seller_taxno'],
    ['tax_type',       'tax_type'],
    ['sales',          'sales'],
    ['tax',            'tax'],
    ['total',          'total'],
    ['currency',       'currency'],
    ['model',          '模型'],
    ['elapsed',        '耗時(秒)'],
    ['edited',         '人工修正欄位'],
  ];

  function collectExportRows() {
    return fileQueue
      .filter(x => x.status === 'done' && x.result)
      .map(x => ({
        filename: x.file.name,
        ...(() => { const r = { ...x.result }; delete r._model; return r; })(),
        model: x.result._model || '',
        elapsed: x.elapsed || '',
        edited: Object.keys(x.editedKeys).join(' / ') || '',
      }));
  }

  function downloadBlob(content, mime, filename) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  }

  function exportCSV() {
    const rows = collectExportRows();
    if (!rows.length) return;
    const esc = v => {
      if (v == null) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const header = EXPORT_COLUMNS.map(c => c[1]).join(',');
    const body = rows.map(r => EXPORT_COLUMNS.map(c => esc(r[c[0]])).join(',')).join('\n');
    // ﻿：BOM，讓 Excel 以 UTF-8 開啟不亂碼
    downloadBlob('﻿' + header + '\n' + body, 'text/csv;charset=utf-8', `發票辨識結果_${exportStamp()}.csv`);
  }

  function exportJSON() {
    const rows = collectExportRows();
    if (!rows.length) return;
    downloadBlob(JSON.stringify(rows, null, 2), 'application/json', `發票辨識結果_${exportStamp()}.json`);
  }

  function updateExportBtns() {
    const hasDone = fileQueue.some(x => x.status === 'done');
    const disp = hasDone ? 'inline-block' : 'none';
    document.getElementById('export-csv-btn').style.display = disp;
    document.getElementById('export-json-btn').style.display = disp;
  }

  // ── 批次統計 ──
  function updateBatchSummary() {
    const el = document.getElementById('batch-summary');
    updateExportBtns();
    if (fileQueue.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    document.getElementById('stat-total').textContent   = fileQueue.length;
    document.getElementById('stat-pending').textContent = fileQueue.filter(x => x.status === 'pending').length;
    document.getElementById('stat-done').textContent    = fileQueue.filter(x => x.status === 'done').length;
    document.getElementById('stat-error').textContent   = fileQueue.filter(x => x.status === 'error').length;
  }
</script>
</body>
</html>
